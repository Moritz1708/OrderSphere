<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F5F0" />
    <title>OrderSphere</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sets data-theme and lang before the first paint. Must stay ahead of the
         stylesheets, and must stay an external file: the production CSP allows
         no inline script. -->
    <script src="js/theme-boot.js"></script>

    <!-- app.css @imports MudBlazor into the lowest cascade layer; preloading it
         removes the extra round trip that import would otherwise cost. -->
    <link rel="preload" as="style" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="preload" as="font" type="font/woff2" href="fonts/InstrumentSerif-Regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/Manrope-Regular.woff2" crossorigin />

    <link href="css/app.css" rel="stylesheet" />
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/base.css" rel="stylesheet" />
    <link href="css/mud-overrides.css" rel="stylesheet" />
    <link href="css/components.css" rel="stylesheet" />
    <link href="css/legacy.css" rel="stylesheet" />
    <link href="css/pages.css" rel="stylesheet" />
    <link href="css/motion.css" rel="stylesheet" />
    <link href="css/utilities.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div id="os-boot">
            <div class="os-boot__mark">OrderSphere</div>
            <div class="os-boot__bar"></div>
        </div>
    </div>

    <!-- Static markup cannot resolve resources, so this one string ships bilingually. -->
    <div id="blazor-error-ui">
        Ein unerwarteter Fehler ist aufgetreten. &middot; An unexpected error occurred.
        <a href="." class="reload">Neu laden / Reload</a>
        <span class="dismiss">&times;</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/voice-interop.js"></script>
</body>
</html>
