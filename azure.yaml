# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Azure Developer CLI (azd) configuration for OrderSphere.
#
# OrderSphere is a .NET Aspire application: the AppHost manifest is the single
# source of truth for the resource topology (Container Apps, PostgreSQL Flexible
# Server, Service Bus, Azure Managed Redis, Key Vault). azd reads that manifest
# at provision/deploy time and generates Bicep — there is no hand-written infra/
# folder. External ingress is limited to ordersphere-bff (WithExternalHttpEndpoints).
#
# Identity provider: Auth0 (tenant ordersphere-dev.eu.auth0.com). Not provisioned
# by azd — supplied via the oidc-authority parameter and four client secrets.
name: ordersphere
services:
  app:
    language: dotnet
    project: ./src/Hosting/OrderSphere.AppHost/OrderSphere.AppHost.csproj
    host: containerapp

# Azure AI Search (catalog hybrid search) is provisioned from the Aspire manifest and its
# data-plane roles (SearchService/SearchIndexData Contributor) are generated by azd. The
# catalog also calls the Foundry embedding deployment with managed identity, but Foundry is
# an external resource (not modelled by this azd project — same as the advisory service), so
# azd cannot generate that role. This hook grants the shared container-app managed identity
# "Cognitive Services OpenAI User" on the Foundry account after every provision. Idempotent.
#
# The shared managed identity's object id is resolved from MANAGED_IDENTITY_CLIENT_ID
# (an output reliably surfaced to hooks) via `az ad sp show` — azd does not export the
# principal/object id directly. Only the external Foundry scope must be set once per env:
#   azd env set AZURE_FOUNDRY_RESOURCE_ID "/subscriptions/.../resourceGroups/.../providers/Microsoft.CognitiveServices/accounts/<foundry>"
# Note: uses `powershell` (5.1) shell — this machine has no pwsh; the script is 5.1-compatible.
#
# D6 — customer-managed key (CMK) for the two Blob Storage accounts (Invoicing PDFs, Catalog
# images; see docs/architecture.md). Enabled here, not in the Aspire-generated Bicep, because
# Azure Storage CMK configured at account-creation time requires a user-assigned identity,
# while a system-assigned one (assigned by AppHost.cs's EnableSystemAssignedIdentity) only
# works once the account already exists — exactly this hook's timing. Same rationale as the
# Foundry grant above: this is exactly the kind of "azd/Aspire's typed model can't cleanly
# express it" case this repo already handles with an imperative postprovision hook rather
# than hand-rolled Bicep. Idempotent — safe to re-run on every provision.
hooks:
  postprovision:
    posix:
      shell: sh
      run: |
        set -e
        if [ -n "$AZURE_RESOURCE_GROUP" ]; then
          KEYVAULT_NAME=$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.KeyVault/vaults \
            --query "[?tags.\"aspire-resource-name\"=='ordersphere-kv'].name | [0]" -o tsv)
          if [ -n "$KEYVAULT_NAME" ]; then
            KEY_NAME="storage-cmk-key"
            az keyvault key show --vault-name "$KEYVAULT_NAME" --name "$KEY_NAME" >/dev/null 2>&1 || \
              az keyvault key create --vault-name "$KEYVAULT_NAME" --name "$KEY_NAME" \
                --kty RSA --size 2048 --only-show-errors >/dev/null
            KEYVAULT_URI=$(az keyvault show --name "$KEYVAULT_NAME" --query properties.vaultUri -o tsv)
            KEYVAULT_ID=$(az keyvault show --name "$KEYVAULT_NAME" --query id -o tsv)

            for TAG in storage invoice-storage; do
              STORAGE_NAME=$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
                --resource-type Microsoft.Storage/storageAccounts \
                --query "[?tags.\"aspire-resource-name\"=='$TAG'].name | [0]" -o tsv)
              if [ -n "$STORAGE_NAME" ]; then
                echo "Enabling CMK on storage account $STORAGE_NAME..."
                PRINCIPAL_ID=$(az storage account show --name "$STORAGE_NAME" \
                  --resource-group "$AZURE_RESOURCE_GROUP" --query identity.principalId -o tsv)
                az role assignment create \
                  --assignee-object-id "$PRINCIPAL_ID" \
                  --assignee-principal-type ServicePrincipal \
                  --role "Key Vault Crypto Service Encryption User" \
                  --scope "$KEYVAULT_ID" \
                  --only-show-errors || true
                # RBAC propagation can lag a few seconds behind the role assignment call.
                for ATTEMPT in 1 2 3 4 5; do
                  if az storage account update --name "$STORAGE_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
                    --encryption-key-source Microsoft.Keyvault \
                    --encryption-key-vault "$KEYVAULT_URI" \
                    --encryption-key-name "$KEY_NAME" \
                    --only-show-errors >/dev/null 2>&1; then
                    break
                  fi
                  sleep 10
                done
              fi
            done
          fi
        fi

        # Budget scaling — opt-in via `azd env set BUDGET_SCALING true`. Aspire's typed model for
        # Azure Container Apps requires an explicit AddAzureContainerAppEnvironment (which this
        # AppHost deliberately does not use — see AppHost.cs's Azure Search WithRoleAssignments
        # comment), so scale-to-zero and CPU/memory sizing are applied imperatively here instead,
        # the same "typed model can't express it" pattern as the CMK/Foundry steps above.
        #
        # ordersphere-bff (external ingress) is kept warm to avoid a cold start on first page load.
        # Every other HTTP-only service scales to zero on Container Apps' built-in HTTP scaler —
        # no custom rule needed, it wakes on the next request.
        #
        # Six services also run a Service-Bus-queue-consuming BackgroundService (queue name is
        # each Workers/*Processor.cs's QueueName constant) that is NOT driven by inbound HTTP, so
        # scaling them to zero WITHOUT a KEDA azure-servicebus scale rule would leave queued
        # messages unprocessed until unrelated traffic happened to wake the app. Each gets one
        # identity-authenticated scale rule per queue it consumes instead, so it wakes on its own
        # when a message arrives and falls back to zero once drained.
        #
        # MaxReplicas is capped at 3 everywhere to bound worst-case cost from a retry storm/spike.
        # Also caps Log Analytics ingestion at 1 GB/day so a logging bug cannot blow the budget via
        # Application Insights ingestion cost.
        #
        # VERIFY AFTER THE FIRST REAL azd provision/deploy: (1) that repeated --scale-rule-name
        # calls on the same app upsert additional named rules rather than replacing the previous
        # one (az containerapp show --name <app> --query properties.template.scale.rules should
        # list all rules for that app); (2) that --scale-rule-identity with the shared user-
        # assigned identity actually authenticates KEDA's queue-depth check (send a message to a
        # queue while its consumer sits at 0 replicas and confirm a replica starts). Neither has
        # been exercised against a live Container App by this change.
        if [ "$BUDGET_SCALING" = "true" ] && [ -n "$AZURE_RESOURCE_GROUP" ]; then
          echo "Applying budget Container Apps scaling..."

          SB_NAMESPACE=$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.ServiceBus/namespaces --query "[0].name" -o tsv)
          IDENTITY_ID=$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.ManagedIdentity/userAssignedIdentities --query "[0].id" -o tsv)

          # Defensive: KEDA's azure-servicebus scaler needs read access to queue depth. Aspire's
          # own generated role assignment for WithReference(serviceBus) should already cover this
          # for the consuming apps — grant it again here (idempotent) in case it doesn't.
          if [ -n "$SB_NAMESPACE" ] && [ -n "$IDENTITY_ID" ]; then
            IDENTITY_PRINCIPAL_ID=$(az identity show --ids "$IDENTITY_ID" --query principalId -o tsv)
            SB_ID=$(az servicebus namespace show --name "$SB_NAMESPACE" \
              --resource-group "$AZURE_RESOURCE_GROUP" --query id -o tsv)
            az role assignment create --assignee-object-id "$IDENTITY_PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal --role "Azure Service Bus Data Owner" \
              --scope "$SB_ID" --only-show-errors || true
          fi

          for APP in ordersphere-catalog ordersphere-basket ordersphere-userprofile \
                     ordersphere-partners ordersphere-webhooks ordersphere-apigateway \
                     ordersphere-mcp ordersphere-ordering ordersphere-payment; do
            az containerapp update --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
              --min-replicas 0 --max-replicas 3 --cpu 0.25 --memory 0.5Gi \
              --only-show-errors || true
          done

          az containerapp update --name ordersphere-bff --resource-group "$AZURE_RESOURCE_GROUP" \
            --min-replicas 1 --max-replicas 3 --cpu 0.25 --memory 0.5Gi --only-show-errors || true

          if [ -n "$SB_NAMESPACE" ] && [ -n "$IDENTITY_ID" ]; then
            add_sb_scale_rule() {
              az containerapp update --name "$1" --resource-group "$AZURE_RESOURCE_GROUP" \
                --min-replicas 0 --max-replicas 3 --cpu 0.25 --memory 0.5Gi \
                --scale-rule-name "$2" --scale-rule-type azure-servicebus \
                --scale-rule-metadata "queueName=$3" "namespace=$SB_NAMESPACE" "messageCount=1" \
                --scale-rule-identity "$IDENTITY_ID" --only-show-errors || true
            }

            add_sb_scale_rule ordersphere-ordering-worker sb-orders orders
            add_sb_scale_rule ordersphere-ordering-worker sb-payment-results payment-results
            add_sb_scale_rule ordersphere-ordering-worker sb-payment-refunds payment-refunds
            add_sb_scale_rule ordersphere-ordering-worker sb-order-history order-history
            add_sb_scale_rule ordersphere-ordering-worker sb-erasure-ordering erasure-ordering

            add_sb_scale_rule ordersphere-notification-worker sb-notification-orders notification-orders
            add_sb_scale_rule ordersphere-notification-worker sb-invoice-ready invoice-ready

            add_sb_scale_rule ordersphere-webhooks-worker sb-webhook-events webhook-events

            add_sb_scale_rule ordersphere-advisory sb-erasure-advisory erasure-advisory

            add_sb_scale_rule ordersphere-invoicing sb-invoice-generation invoice-generation

            add_sb_scale_rule ordersphere-payment-worker sb-refund-requested refund-requested
            add_sb_scale_rule ordersphere-payment-worker sb-payment-requests payment-requests
            add_sb_scale_rule ordersphere-payment-worker sb-order-confirmation-failed order-confirmation-failed
            add_sb_scale_rule ordersphere-payment-worker sb-erasure-payment erasure-payment
          else
            echo "Skipping Service Bus KEDA scale rules: namespace or managed identity not found."
          fi

          WORKSPACE_NAME=$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.OperationalInsights/workspaces --query "[0].name" -o tsv)
          if [ -n "$WORKSPACE_NAME" ]; then
            az monitor log-analytics workspace update --resource-group "$AZURE_RESOURCE_GROUP" \
              --workspace-name "$WORKSPACE_NAME" --daily-quota-gb 1 --only-show-errors || true
          fi
        fi

        if [ -z "$AZURE_FOUNDRY_RESOURCE_ID" ] || [ -z "$MANAGED_IDENTITY_CLIENT_ID" ]; then
          echo "Skipping Foundry role grant: AZURE_FOUNDRY_RESOURCE_ID or MANAGED_IDENTITY_CLIENT_ID not set."
          exit 0
        fi
        OBJECT_ID=$(az ad sp show --id "$MANAGED_IDENTITY_CLIENT_ID" --query id -o tsv)
        echo "Granting 'Cognitive Services OpenAI User' to $OBJECT_ID on Foundry..."
        az role assignment create \
          --assignee-object-id "$OBJECT_ID" \
          --assignee-principal-type ServicePrincipal \
          --role "Cognitive Services OpenAI User" \
          --scope "$AZURE_FOUNDRY_RESOURCE_ID" \
          --only-show-errors || true
    windows:
      shell: powershell
      run: |
        if ($env:AZURE_RESOURCE_GROUP) {
          $keyVaultName = az resource list --resource-group $env:AZURE_RESOURCE_GROUP `
            --resource-type Microsoft.KeyVault/vaults `
            --query "[?tags.`"aspire-resource-name`"=='ordersphere-kv'].name | [0]" -o tsv
          if ($keyVaultName) {
            $keyName = "storage-cmk-key"
            az keyvault key show --vault-name $keyVaultName --name $keyName *> $null
            if ($LASTEXITCODE -ne 0) {
              az keyvault key create --vault-name $keyVaultName --name $keyName --kty RSA --size 2048 --only-show-errors | Out-Null
            }
            $keyVaultUri = az keyvault show --name $keyVaultName --query properties.vaultUri -o tsv
            $keyVaultId = az keyvault show --name $keyVaultName --query id -o tsv

            foreach ($tag in @("storage", "invoice-storage")) {
              $storageName = az resource list --resource-group $env:AZURE_RESOURCE_GROUP `
                --resource-type Microsoft.Storage/storageAccounts `
                --query "[?tags.`"aspire-resource-name`"=='$tag'].name | [0]" -o tsv
              if ($storageName) {
                Write-Host "Enabling CMK on storage account $storageName..."
                $principalId = az storage account show --name $storageName `
                  --resource-group $env:AZURE_RESOURCE_GROUP --query identity.principalId -o tsv
                az role assignment create `
                  --assignee-object-id $principalId `
                  --assignee-principal-type ServicePrincipal `
                  --role "Key Vault Crypto Service Encryption User" `
                  --scope $keyVaultId `
                  --only-show-errors
                # RBAC propagation can lag a few seconds behind the role assignment call.
                for ($attempt = 1; $attempt -le 5; $attempt++) {
                  az storage account update --name $storageName --resource-group $env:AZURE_RESOURCE_GROUP `
                    --encryption-key-source Microsoft.Keyvault `
                    --encryption-key-vault $keyVaultUri `
                    --encryption-key-name $keyName `
                    --only-show-errors | Out-Null
                  if ($LASTEXITCODE -eq 0) { break }
                  Start-Sleep -Seconds 10
                }
              }
            }
          }
        }

        # Budget scaling — opt-in via `azd env set BUDGET_SCALING true`. See the posix branch above
        # for the full rationale and the "verify after first real provision" caveats (KEDA scale-
        # rule upsert behavior and --scale-rule-identity auth have not been exercised live).
        if ($env:BUDGET_SCALING -eq "true" -and $env:AZURE_RESOURCE_GROUP) {
          Write-Host "Applying budget Container Apps scaling..."

          $sbNamespace = az resource list --resource-group $env:AZURE_RESOURCE_GROUP `
            --resource-type Microsoft.ServiceBus/namespaces --query "[0].name" -o tsv
          $identityId = az resource list --resource-group $env:AZURE_RESOURCE_GROUP `
            --resource-type Microsoft.ManagedIdentity/userAssignedIdentities --query "[0].id" -o tsv

          if ($sbNamespace -and $identityId) {
            $identityPrincipalId = az identity show --ids $identityId --query principalId -o tsv
            $sbId = az servicebus namespace show --name $sbNamespace `
              --resource-group $env:AZURE_RESOURCE_GROUP --query id -o tsv
            az role assignment create --assignee-object-id $identityPrincipalId `
              --assignee-principal-type ServicePrincipal --role "Azure Service Bus Data Owner" `
              --scope $sbId --only-show-errors
          }

          $httpOnlyApps = @("ordersphere-catalog", "ordersphere-basket", "ordersphere-userprofile",
            "ordersphere-partners", "ordersphere-webhooks", "ordersphere-apigateway",
            "ordersphere-mcp", "ordersphere-ordering", "ordersphere-payment")
          foreach ($app in $httpOnlyApps) {
            az containerapp update --name $app --resource-group $env:AZURE_RESOURCE_GROUP `
              --min-replicas 0 --max-replicas 3 --cpu 0.25 --memory 0.5Gi --only-show-errors
          }

          az containerapp update --name ordersphere-bff --resource-group $env:AZURE_RESOURCE_GROUP `
            --min-replicas 1 --max-replicas 3 --cpu 0.25 --memory 0.5Gi --only-show-errors

          if ($sbNamespace -and $identityId) {
            function Add-SbScaleRule($appName, $ruleName, $queueName) {
              az containerapp update --name $appName --resource-group $env:AZURE_RESOURCE_GROUP `
                --min-replicas 0 --max-replicas 3 --cpu 0.25 --memory 0.5Gi `
                --scale-rule-name $ruleName --scale-rule-type azure-servicebus `
                --scale-rule-metadata "queueName=$queueName" "namespace=$sbNamespace" "messageCount=1" `
                --scale-rule-identity $identityId --only-show-errors
            }

            Add-SbScaleRule ordersphere-ordering-worker sb-orders orders
            Add-SbScaleRule ordersphere-ordering-worker sb-payment-results payment-results
            Add-SbScaleRule ordersphere-ordering-worker sb-payment-refunds payment-refunds
            Add-SbScaleRule ordersphere-ordering-worker sb-order-history order-history
            Add-SbScaleRule ordersphere-ordering-worker sb-erasure-ordering erasure-ordering

            Add-SbScaleRule ordersphere-notification-worker sb-notification-orders notification-orders
            Add-SbScaleRule ordersphere-notification-worker sb-invoice-ready invoice-ready

            Add-SbScaleRule ordersphere-webhooks-worker sb-webhook-events webhook-events

            Add-SbScaleRule ordersphere-advisory sb-erasure-advisory erasure-advisory

            Add-SbScaleRule ordersphere-invoicing sb-invoice-generation invoice-generation

            Add-SbScaleRule ordersphere-payment-worker sb-refund-requested refund-requested
            Add-SbScaleRule ordersphere-payment-worker sb-payment-requests payment-requests
            Add-SbScaleRule ordersphere-payment-worker sb-order-confirmation-failed order-confirmation-failed
            Add-SbScaleRule ordersphere-payment-worker sb-erasure-payment erasure-payment
          } else {
            Write-Host "Skipping Service Bus KEDA scale rules: namespace or managed identity not found."
          }

          $workspaceName = az resource list --resource-group $env:AZURE_RESOURCE_GROUP `
            --resource-type Microsoft.OperationalInsights/workspaces --query "[0].name" -o tsv
          if ($workspaceName) {
            az monitor log-analytics workspace update --resource-group $env:AZURE_RESOURCE_GROUP `
              --workspace-name $workspaceName --daily-quota-gb 1 --only-show-errors
          }
        }

        if (-not $env:AZURE_FOUNDRY_RESOURCE_ID -or -not $env:MANAGED_IDENTITY_CLIENT_ID) {
          Write-Host "Skipping Foundry role grant: AZURE_FOUNDRY_RESOURCE_ID or MANAGED_IDENTITY_CLIENT_ID not set."
          exit 0
        }
        $objectId = az ad sp show --id $env:MANAGED_IDENTITY_CLIENT_ID --query id -o tsv
        Write-Host "Granting 'Cognitive Services OpenAI User' to $objectId on Foundry..."
        az role assignment create `
          --assignee-object-id $objectId `
          --assignee-principal-type ServicePrincipal `
          --role "Cognitive Services OpenAI User" `
          --scope $env:AZURE_FOUNDRY_RESOURCE_ID `
          --only-show-errors
        if ($LASTEXITCODE -ne 0) { Write-Host "Role assignment already present or non-fatal error; continuing." }
